name: Website quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The checks only read repository contents; they never deploy or publish.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (do not persist authentication credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify generated site
        run: npm test
